name: Windows Desktop

on:
  push:
    branches:
      - main
      - release/windows-v2.0.0
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop-lock.txt

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Install Python test and locked desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-desktop-lock.txt

      - name: Run frontend tests
        run: npm run frontend:test

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Verify release version for v2.0.0 tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$packageVersion."
          }
          if ($packageVersion -ne "2.0.0") {
            throw "This release workflow is configured for the initial 2.0.0 desktop release."
          }

      - name: Build installer and portable executable
        run: npm run desktop:dist

      - name: Install, launch, restart, reinstall, and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-release-smoke.ps1

      - name: Generate release checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -Filter "AAPESH-*.exe" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          if (-not $lines) { throw "No release executables were generated." }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AAPESH-Windows-x64
          path: |
            release/AAPESH-Setup-x64.exe
            release/AAPESH-Portable-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.ref == 'refs/tags/v2.0.0'
    needs: windows-build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: AAPESH-Windows-x64
          path: release

      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          ref: v2.0.0

      - name: Publish AAPESH 2.0.0 GitHub release
        if: github.ref == 'refs/tags/v2.0.0'
        uses: softprops/action-gh-release@v2
        with:
          name: AAPESH 2.0 - Windows Release
          body_path: docs/releases/v2.0.0.md
          files: |
            release/AAPESH-Setup-x64.exe
            release/AAPESH-Portable-x64.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
